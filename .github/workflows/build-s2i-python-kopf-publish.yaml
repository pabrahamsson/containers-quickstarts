---
name: build-s2i-python-kopf-publish
on:
  push:
    paths:
      - build-s2i-python-kopf/version.json
      - .github/workflows/build-s2i-python-kopf-publish.yaml
jobs:
  publish-secret:
    runs-on: ubuntu-latest
    outputs:
      exist: ${{ steps.check-publish.outputs.exist }}
    steps:
      - name: Check if PUBLISH_IMAGE secret is set
        id: check-publish
        run: |
          if [ -n "${{ secrets.PUBLISH_IMAGE }}" ]; then
            echo "exist=true" >> $GITHUB_OUTPUT
            echo "value: ${{ secrets.PUBLISH_IMAGE }}"
          else
            echo "exist=false" >> $GITHUB_OUTPUT
          fi

  publish:
    if: github.repository == 'redhat-cop/containers-quickstarts' || ${{ needs.publish-secret.outputs.exist }} == 'true'
    needs: publish-secret
    env:
      CONTEXT_DIR: build-s2i-python-kopf
      IMAGE_NAME: python-kopf-s2i
      REGISTRY: ${{ secrets.REGISTRY_URI }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "true or false: ${{ needs.publish-secret.outputs.exist }}"

      - uses: actions/checkout@v3

      - name: Get image tags
        id: image_tags
        uses: redhat-cop/github-actions/get-image-version@master
        with:
          IMAGE_CONTEXT_DIR: ${{ env.CONTEXT_DIR }}

      - name: Build image
        id: build_image
        uses: redhat-actions/buildah-build@v2
        with:
          context: ${{ env.CONTEXT_DIR }}
          dockerfiles: |
            ./${{ env.CONTEXT_DIR }}/Dockerfile
          image: ${{ env.IMAGE_NAME }}
          tags: "${{ steps.image_tags.outputs.IMAGE_TAGS }}"

      - name: Push to ghcr.io
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build_image.outputs.image }}
          registry: ghcr.io/${{ github.repository }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
          tags: ${{ steps.build_image.outputs.tags }}

      - name: Push to Quay
        if: ${{ env.REGISTRY }} != ""
        id: push_to_quay
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build_image.outputs.image }}
          registry: ${{ secrets.REGISTRY_URI }}/${{ secrets.REGISTRY_REPOSITORY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
          tags: ${{ steps.build_image.outputs.tags }}
